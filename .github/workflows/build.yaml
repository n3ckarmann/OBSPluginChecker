name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'release-notes/**', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'release-notes/**', 'docs/**']
  workflow_dispatch:
    inputs:
      release:
        description: Draft a release for the version in buildspec.json
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same branch or PR cancels the build that is still running.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows x64
    # The private dev repo only builds a main commit in its PR; the push to main
    # would build the same code again on paid minutes.
    if: github.event_name != 'push' || github.ref_type == 'tag' || !github.event.repository.private
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read version
        id: spec
        run: |
          $spec = Get-Content buildspec.json -Raw | ConvertFrom-Json
          "name=$($spec.name)" >> $env:GITHUB_OUTPUT
          "version=$($spec.version)" >> $env:GITHUB_OUTPUT

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .deps
          key: windows-deps-${{ hashFiles('buildspec.json') }}

      - name: Build
        run: .github/scripts/Build-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Package
        run: .github/scripts/Package-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      # Same layout as most OBS plugins: the ZIP's content goes straight into the OBS folder.
      # The installer puts the same files into the OBS folder the user picks.
      - name: Package ZIP and installer
        env:
          NAME: ${{ steps.spec.outputs.name }}
          VERSION: ${{ steps.spec.outputs.version }}
          BASE: ${{ steps.spec.outputs.name }}-${{ steps.spec.outputs.version }}-windows-x64
        run: |
          $src = "release/unpacked"
          Expand-Archive "release/$env:BASE.zip" $src -Force
          Remove-Item "release/$env:BASE.zip"

          $stage = (New-Item -ItemType Directory "release/stage" -Force).FullName
          New-Item -ItemType Directory "$stage/obs-plugins/64bit" -Force | Out-Null
          New-Item -ItemType Directory "$stage/data/obs-plugins" -Force | Out-Null
          Copy-Item "$src/$env:NAME/bin/64bit/*" "$stage/obs-plugins/64bit/"
          Copy-Item "$src/$env:NAME/data" "$stage/data/obs-plugins/$env:NAME" -Recurse
          Compress-Archive -Path "$stage/*" -DestinationPath "release/$env:BASE.zip" -CompressionLevel Optimal

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $out = (Resolve-Path release).Path
          & $iscc /Qp "/DVersion=$env:VERSION" "/DStage=$stage" "/DOutDir=$out" packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

          Get-ChildItem release -File | Select-Object Name, Length
          [IO.Compression.ZipFile]::OpenRead((Resolve-Path "release/$env:BASE.zip").Path).Entries.FullName

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.spec.outputs.name }}-${{ steps.spec.outputs.version }}-windows-x64-${{ github.sha }}
          path: |
            release/${{ steps.spec.outputs.name }}-${{ steps.spec.outputs.version }}-windows-x64.zip
            release/${{ steps.spec.outputs.name }}-${{ steps.spec.outputs.version }}-windows-x64-installer.exe

  macos:
    name: macOS Universal
    if: github.event_name != 'push' || github.ref_type == 'tag' || !github.event.repository.private
    runs-on: macos-15
    env:
      CODESIGN_IDENT: "-"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read version
        id: spec
        run: |
          echo "name=$(jq -r .name buildspec.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version buildspec.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .deps
          key: macos-deps-${{ hashFiles('buildspec.json') }}

      - name: Build
        run: |
          cmake --preset macos-ci -DENABLE_CCACHE=OFF -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF
          cmake --build --preset macos-ci

      - name: Package
        run: |
          cmake --install build_macos --config RelWithDebInfo --prefix release/RelWithDebInfo
          cd release/RelWithDebInfo
          ditto -c -k --keepParent ${{ steps.spec.outputs.name }}.plugin \
            ../${{ steps.spec.outputs.name }}-${{ steps.spec.outputs.version }}-macos-universal.zip
          mv ${{ steps.spec.outputs.name }}.pkg \
            ../${{ steps.spec.outputs.name }}-${{ steps.spec.outputs.version }}-macos-universal.pkg

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.spec.outputs.name }}-${{ steps.spec.outputs.version }}-macos-universal-${{ github.sha }}
          path: release/${{ steps.spec.outputs.name }}-${{ steps.spec.outputs.version }}-macos-universal.*

  linux:
    name: Ubuntu 24.04 x86_64
    if: github.event_name != 'push' || github.ref_type == 'tag' || !github.event.repository.private
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read version
        id: spec
        run: |
          echo "name=$(jq -r .name buildspec.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version buildspec.json)" >> "$GITHUB_OUTPUT"

      - name: Install OBS and build tools
        timeout-minutes: 10
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o obs.deb https://github.com/obsproject/obs-studio/releases/download/32.0.2/OBS-Studio-32.0.2-Ubuntu-24.04-x86_64.deb
          # A stalled mirror otherwise hangs apt until the step times out.
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $apt_opts update
          sudo apt-get $apt_opts install -y --no-install-recommends ./obs.deb qt6-base-dev libcurl4-openssl-dev libsimde-dev ninja-build

      - name: Build
        run: |
          cmake --preset ubuntu-x86_64 -DCMAKE_PREFIX_PATH=/usr/local
          cmake --build build_x86_64

      - name: Package
        run: |
          dir=release/${{ steps.spec.outputs.name }}
          mkdir -p "$dir/bin/64bit"
          cp build_x86_64/${{ steps.spec.outputs.name }}.so "$dir/bin/64bit/"
          cp -r data "$dir/data"
          cp build_x86_64/manifest.json "$dir/data/manifest.json"
          cd release && tar -cJf ${{ steps.spec.outputs.name }}-${{ steps.spec.outputs.version }}-linux-x86_64.tar.xz ${{ steps.spec.outputs.name }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.spec.outputs.name }}-${{ steps.spec.outputs.version }}-linux-x86_64-${{ github.sha }}
          path: release/${{ steps.spec.outputs.name }}-${{ steps.spec.outputs.version }}-linux-x86_64.tar.xz

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version buildspec.json)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match buildspec.json version ${version}"
              exit 1
            fi
            # Publishing a draft pushes its tag, which starts this workflow again.
            if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "Release ${GITHUB_REF_NAME} already exists, nothing to draft."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif gh release view "v${version}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::Release v${version} already exists. Raise the version in buildspec.json first."
            exit 1
          fi
          echo "name=v${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.tag.outputs.skip != 'true'
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$PWD/release-notes/${{ steps.tag.outputs.name }}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Missing $notes. Write the release notes before drafting the release."
            exit 1
          fi
          cd dist
          ls -l
          sha256sum * > SHA256SUMS.txt
          tag=${{ steps.tag.outputs.name }}
          # Without a pushed tag, GitHub creates it on GITHUB_SHA when the draft is published.
          gh release create "$tag" * \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --draft \
            --title "Plugin-Checker ${tag#v}" \
            --notes-file "$notes"
